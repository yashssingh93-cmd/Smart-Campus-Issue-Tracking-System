{% extends "base.html" %}
{% block title %}Register – Smart Campus Portal{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-200/70 p-4">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-sm border border-slate-300 overflow-hidden">
    <div class="bg-slate-900 px-6 py-4 text-white border-b border-slate-800">
      <h1 class="text-sm font-semibold tracking-wide">Campus Service Desk Registration</h1>
      <p class="text-slate-400 text-xs">Create your student or technician account</p>
    </div>
    <div class="p-6">
      <div class="flex border border-slate-300 rounded mb-4 text-xs font-medium overflow-hidden">
        <button type="button" onclick="setRole('student')" id="tab-stu" class="flex-1 py-1.5 bg-blue-600 text-white">Student Account</button>
        <button type="button" onclick="setRole('technician')" id="tab-tech" class="flex-1 py-1.5 bg-slate-100 text-slate-700">Technician Account</button>
      </div>
      <form method="POST" action="{{ url_for('register') }}" class="space-y-3">
        <input type="hidden" name="role" id="role-in" value="student" />
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Username</label>
          <input type="text" name="username" required autofocus class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs outline-none focus:border-blue-600" placeholder="Username" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Institutional Email</label>
          <input type="email" name="email" required class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs outline-none focus:border-blue-600" placeholder="username@campus.edu" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
          <input type="password" name="password" required minlength="6" class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs outline-none focus:border-blue-600" placeholder="Minimum 6 characters" />
        </div>
        <div id="tech-fields" class="hidden space-y-2 border-t border-slate-200 pt-2">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Contact Phone Number *</label>
            <input type="tel" name="phone" id="phone-in" class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs outline-none focus:border-blue-600" placeholder="e.g. 9801234567" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Maintenance Team</label>
            <select name="team" class="w-full px-3 py-1.5 border border-slate-300 rounded text-xs outline-none bg-white">
              <option value="IT & Network Team">IT & Network Team</option>
              <option value="Electrical & AC Team">Electrical & AC Team</option>
              <option value="Civil & Plumbing Team">Civil & Plumbing Team</option>
              <option value="Lab Support Team">Lab Support Team</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded text-xs transition">Create Account</button>
        <div class="text-center pt-1"><a href="{{ url_for('login') }}" class="text-xs text-blue-600 hover:underline">Already registered? Return to Login</a></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function setRole(r){
  document.getElementById('role-in').value=r;
  const isT=r==='technician';
  document.getElementById('tech-fields').classList.toggle('hidden',!isT);
  document.getElementById('phone-in').required=isT;
  document.getElementById('tab-tech').className=isT?'flex-1 py-1.5 bg-blue-600 text-white':'flex-1 py-1.5 bg-slate-100 text-slate-700';
  document.getElementById('tab-stu').className=isT?'flex-1 py-1.5 bg-slate-100 text-slate-700':'flex-1 py-1.5 bg-blue-600 text-white';
}
</script>
{% endblock %}
